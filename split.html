<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TomTom Use cases — Split</title>
  <meta name="description" content="Split layout — docked sidebar + map. Same use cases, different screen structure." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=fira-code:500" />
</head>
<body>
  <div class="split">
    <!-- ============ SIDEBAR — picker + docked detail ============ -->
    <aside class="sidebar" aria-label="Use cases">
      <!-- Single navigation bar. List state: the "Explore use cases"
           heading. Detail state: a breadcrumb — back link + the open
           case's title. No TomTom mark, so the rail sits cleanly inside
           an embed. -->
      <div class="nav-bar">
        <div class="nav-left">
          <span class="nav-title">Explore use cases</span>
          <span class="badge-count" id="case-count" aria-label="use cases">11</span>
          <button class="back-btn" id="back-btn" type="button" aria-label="Back to all use cases" title="Back to all use cases">
            <svg data-icon="chev-left" width="16" height="16" aria-hidden="true"></svg>
          </button>
          <span class="nav-crumb"><span class="cur" id="nav-current"></span></span>
        </div>
        <label class="nav-search">
          <svg class="nav-search-ico" data-icon="search" width="16" height="16" aria-hidden="true"></svg>
          <input id="split-search" type="search" placeholder="Search use cases…" aria-label="Search use cases" autocomplete="off" />
        </label>
        <button class="nav-icon-btn" id="search-btn" type="button" aria-label="Search use cases" title="Search use cases">
          <svg class="ico-search" data-icon="search" width="16" height="16" aria-hidden="true"></svg>
          <svg class="ico-close" data-icon="x" width="16" height="16" aria-hidden="true"></svg>
        </button>
      </div>

      <!-- Master-detail rail: one panel that swaps between the case list
           and the selected case's detail. `.sidebar.is-detail` slides the
           detail view in over the list. -->
      <!-- Drag the divider to resize the rail; double-click resets, arrow
           keys nudge. Hidden on stacked (mobile) layout. -->
      <div class="resizer" id="resizer" role="separator" aria-orientation="vertical"
           aria-label="Resize panel" title="Drag to resize · double-click to reset" tabindex="0"></div>

      <div class="sidebar-views">
        <!-- LIST VIEW (master) -->
        <section class="view view-list" id="view-list" aria-label="Use cases">
          <div class="picker-bar">
            <div class="chip-scroll">
              <div class="cat-chips" id="cat-chips" role="tablist" aria-label="Category"></div>
              <button class="chip-nav chip-nav--prev" id="chips-prev" type="button" aria-label="Scroll categories left" title="Scroll categories left" hidden>
                <svg data-icon="chev-left" width="16" height="16" aria-hidden="true"></svg>
              </button>
              <button class="chip-nav chip-nav--next" id="chips-next" type="button" aria-label="Scroll categories right" title="Scroll categories right" hidden>
                <svg data-icon="chev-right" width="16" height="16" aria-hidden="true"></svg>
              </button>
            </div>
          </div>
          <ul class="case-list" id="case-list" role="listbox" aria-label="Use cases"></ul>
          <p class="empty" id="empty-state" hidden>
            Nothing matches that. Try a broader term or
            <button class="link" id="empty-reset" type="button">reset filters</button>.
          </p>
        </section>

        <!-- DETAIL VIEW -->
        <section class="view view-detail" id="view-detail" aria-label="Selected use case" aria-hidden="true">
          <div class="detail-scroll">
            <div id="detail-content"></div>
          </div>
        </section>
      </div>
    </aside>

    <!-- ============ MAP CELL — controls anchor inside the stage ============ -->
    <div class="stage" id="stage">
      <div class="map-canvas" id="map-canvas"></div>
      <div class="stage-fade is-active" id="stage-fade" aria-hidden="true"></div>
      <div class="stage-vignette" aria-hidden="true"></div>

      <div class="map-ctls" aria-label="Map controls">
        <button class="fab" id="theme-toggle" type="button" aria-label="Theme switch" title="Theme switch">
          <svg class="ico-moon" data-icon="moon" width="16" height="16" aria-hidden="true"></svg>
          <svg class="ico-sun" data-icon="sun" width="16" height="16" aria-hidden="true"></svg>
        </button>
        <button class="fab" id="compass" type="button" aria-label="Switch to 3D" title="Switch to 3D">
          <svg data-icon="3d" width="22" height="22" aria-hidden="true"></svg>
        </button>
        <button class="fab" id="locate-btn" type="button" aria-label="Recenter on use case" title="Recenter on use case">
          <svg data-icon="locate" width="18" height="18" aria-hidden="true"></svg>
        </button>
        <div class="zoom-group" role="group" aria-label="Zoom">
          <button class="zoom-btn" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">
            <svg data-icon="plus" width="16" height="16" aria-hidden="true"></svg>
          </button>
          <div class="zoom-divider"></div>
          <button class="zoom-btn" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">
            <svg data-icon="minus" width="16" height="16" aria-hidden="true"></svg>
          </button>
        </div>
      </div>

      <div class="map-legend" id="map-legend" role="region" aria-label="Map legend" hidden></div>

      <div class="map-side" id="map-side" role="region" aria-label="Scene details" hidden></div>

      <div class="attr" aria-label="TomTom · OpenStreetMap">
        <a class="attr-logo" id="attr-logo"
           href="https://www.tomtom.com/tomtom-orbis-maps/"
           target="_blank" rel="noopener noreferrer"
           aria-label="Learn about TomTom Orbis Maps"></a>
        <a class="attr-credit"
           href="https://www.openstreetmap.org/copyright"
           target="_blank" rel="noopener noreferrer">© OpenStreetMap</a>
      </div>
    </div>
  </div>

  <!-- No access gate: this shell is the embeddable one — it drops the
       password so it can live inside an <iframe> on another page. -->

  <script type="module" src="/src/layouts/split.js"></script>
</body>
</html>

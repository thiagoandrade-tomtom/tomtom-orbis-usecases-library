<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed harness — scroll conflict</title>
<!-- Dev-only harness for the cooperative-gestures behaviour (see isEmbedded()
     in src/app/core.js). Stands in for the Framer /demos page: a scrolling
     host with links above and below an embedded split view.

     NOT part of the production build — vite.config.js lists only index.html
     and split.html as build inputs, so this file is served by `npm run dev`
     and never lands in dist/. -->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    font: 16px/1.5 'Helvetica Neue', Arial, sans-serif;
    background: #0C0C12; color: #fff;
  }
  section { padding: 64px 40px; max-width: 720px; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  p  { color: rgba(255,255,255,.72); margin: 0 0 24px; }
  ul { padding-left: 20px; color: rgba(255,255,255,.72); }
  a  { color: #fff; }
  .modes { display: flex; gap: 8px; margin: 24px 0 0; flex-wrap: wrap; }
  .modes button {
    font: inherit; font-size: 14px; cursor: pointer;
    padding: 8px 16px; border-radius: 999px;
    background: transparent; color: #fff;
    border: 1px solid rgba(255,255,255,.24);
  }
  .modes button[aria-pressed="true"] { background: #DF1B12; border-color: #DF1B12; }
  .frame { border-top: 1px solid rgba(255,255,255,.16); border-bottom: 1px solid rgba(255,255,255,.16); }
  iframe { display: block; width: 100%; height: 88vh; border: 0; }
  code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 5px; font-size: 14px; }
</style>
</head>
<body>

<section>
  <h1>Host page — this scrolls</h1>
  <p>Stands in for the Framer <code>/demos</code> page. Scroll down into the map and try to keep scrolling.</p>
  <div class="modes">
    <button data-mode="auto"  aria-pressed="true">auto (no param)</button>
    <button data-mode="1">?embed=1</button>
    <button data-mode="0">?embed=0 — the old conflict</button>
  </div>
</section>

<div class="frame"><iframe title="split demo"></iframe></div>

<section>
  <h1>More demos</h1>
  <p>The links that made the page scrollable in the first place.</p>
  <ul>
    <li><a href="/split.html">Split view</a></li>
    <li><a href="/index.html">Full map</a></li>
  </ul>
</section>

<script>
  const frame = document.querySelector('iframe');
  const load = mode => {
    frame.src = mode === 'auto' ? '/split.html' : `/split.html?embed=${mode}`;
    document.querySelectorAll('.modes button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  };
  document.querySelector('.modes').addEventListener('click', e => {
    const mode = e.target.closest('button')?.dataset.mode;
    if (mode) load(mode);
  });
  load('auto');
</script>

</body>
</html>

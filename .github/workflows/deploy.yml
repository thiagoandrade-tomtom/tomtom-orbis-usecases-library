# Build the Vite app on every push to main and publish dist/ to GitHub Pages.
#
# The repo-level guard on each job means this workflow ONLY runs in
# thiagoandrade-tomtom/tomtom-orbis-usecases-library (where Pages is enabled).
# On any other fork/mirror (e.g. the private AlvaroGraca-TomTom one), the
# jobs are skipped — the workflow shows up as a neutral "skipped" run, never
# a red failure, and never burns Actions minutes.
#
# Repo secret `VITE_TOMTOM_API_KEY` is injected at build time — Vite bakes
# any `VITE_*` env var into the client bundle via `import.meta.env`.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; newer pushes cancel queued runs but never
# interrupt a deploy that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'thiagoandrade-tomtom/tomtom-orbis-usecases-library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_TOMTOM_API_KEY:  ${{ secrets.VITE_TOMTOM_API_KEY }}
          VITE_ACCESS_PASSWORD: ${{ secrets.VITE_ACCESS_PASSWORD }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.repository == 'thiagoandrade-tomtom/tomtom-orbis-usecases-library'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
